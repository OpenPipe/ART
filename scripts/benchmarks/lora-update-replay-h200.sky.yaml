name: art-lora-update-replay-h200

workdir: .

resources:
  cloud: kubernetes
  accelerators: H200:4
  cpus: "32+"
  memory: "256+"

envs:
  CUDA_HOME: /usr/local/cuda-12.8
  TORCH_CUDA_ARCH_LIST: "9.0"
  UV_CONCURRENT_BUILDS: "1"
  UV_LINK_MODE: copy
  WANDB_ENTITY: wb-training
  WANDB_PROJECT: bench

setup: |
  set -euo pipefail
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --extra megatron
  uv run --no-sync bash src/art/megatron/setup.sh
  cd vllm_runtime
  uv sync

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  mkdir -p scratch/lora-update-replay
  uv run --no-sync python scripts/benchmarks/prepare_lora_update_replay.py \
    --output scratch/lora-update-replay/inputs

  request_jsonl="$PWD/scratch/lora-update-replay/inputs/requests.jsonl"
  mkdir -p scratch/lora-update-replay/fixed-load
  uv run --no-sync python scripts/benchmarks/service_lora_update_replay.py \
    --request-jsonl "$request_jsonl" \
    --mode fixed-load \
    --warmups 5 \
    --updates 30 \
    --output scratch/lora-update-replay/fixed-load \
    > scratch/lora-update-replay/fixed-load/stdout.log \
    2> scratch/lora-update-replay/fixed-load/stderr.log
  uv run --no-sync python scripts/benchmarks/upload_lora_update_replay.py \
    --input scratch/lora-update-replay/fixed-load \
    --mode fixed-load

  mkdir -p scratch/lora-update-replay/idle
  uv run --no-sync python scripts/benchmarks/service_lora_update_replay.py \
    --request-jsonl "$request_jsonl" \
    --mode idle \
    --warmups 5 \
    --updates 30 \
    --output scratch/lora-update-replay/idle \
    > scratch/lora-update-replay/idle/stdout.log \
    2> scratch/lora-update-replay/idle/stderr.log
  uv run --no-sync python scripts/benchmarks/upload_lora_update_replay.py \
    --input scratch/lora-update-replay/idle \
    --mode idle

config:
  kubernetes:
    pod_config:
      spec:
        schedulerName: binpack-scheduler
        activeDeadlineSeconds: 21600
        containers:
          - name: ray-node
            envFrom:
              - secretRef:
                  name: vivek-dev-api-keys
