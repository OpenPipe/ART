name: Package Install

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build managed-runtime wheel
        run: python scripts/build_package.py --wheel

      - name: Smoke test base wheel import
        run: |
          wheel_path="$(python - <<'PY'
          from pathlib import Path

          print(next(Path("dist").glob("openpipe_art-*.whl")).resolve())
          PY
          )"

          project_dir="$(mktemp -d)"
          cd "$project_dir"
          uv init --name art-base-install-smoke --python 3.12 --bare
          uv add "openpipe-art @ file://${wheel_path}"
          uv run python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None; assert importlib.util.find_spec('torch') is None; import art; from art.pipeline_trainer import PipelineTrainer; print(art.__name__, PipelineTrainer.__name__)"
          uv add "weave==0.52.41"
          uv run python -c "from weave.trace.settings import override_settings; import art"

      - name: Smoke test uv add + sync for backend extra
        run: |
          wheel_path="$(python - <<'PY'
          from pathlib import Path

          print(next(Path("dist").glob("openpipe_art-*.whl")).resolve())
          PY
          )"

          project_dir="$(mktemp -d)"
          cd "$project_dir"
          uv init --name art-install-smoke --python 3.12 --bare
          uv add "openpipe-art[backend] @ file://${wheel_path}"
          uv sync

      - name: Smoke test distributed wheel surface
        env:
          ART_VLLM_RUNTIME_CACHE_DIR: ${{ runner.temp }}/art-vllm-runtime-cache
        run: |
          wheel_path="$(python - <<'PY'
          from pathlib import Path

          print(next(Path("dist").glob("openpipe_art-*.whl")).resolve())
          PY
          )"

          project_dir="$(mktemp -d)"
          cd "$project_dir"
          uv init --name art-distributed-install-smoke --python 3.12 --bare
          uv venv --python 3.12
          uv pip install --python .venv/bin/python \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.11.0"
          uv pip install --python .venv/bin/python \
            "openpipe-art[distributed] @ file://${wheel_path}"
          uv pip install --python .venv/bin/python --no-deps \
            "openpipe-art[distributed,megatron] @ file://${wheel_path}"

          .venv/bin/python - <<'PY'
          import sys
          from importlib.metadata import metadata
          from pathlib import Path

          import art
          import art.distributed as distributed

          assert Path(art.__file__).resolve().is_relative_to(Path(sys.prefix))
          assert "art.distributed.art_runtime" not in sys.modules
          from art.distributed import (  # noqa: E402
              ArtRuntime,
              ClusterSpec,
              HostSpec,
              InstalledAsyncCallable,
              NcclTransportSpec,
              PackingRequest,
              compile_topology,
          )

          assert all(
              value is not None
              for value in (
                  ArtRuntime,
                  ClusterSpec,
                  HostSpec,
                  InstalledAsyncCallable,
                  NcclTransportSpec,
                  PackingRequest,
                  compile_topology,
              )
          )
          assert "monarch" not in sys.modules
          assert "PackingRequest" in distributed.__all__
          assert "NcclTransportSpec" in distributed.__all__
          assert {"distributed", "megatron"} <= set(
              metadata("openpipe-art").get_all("Provides-Extra") or ()
          )
          PY

          PYTHONPATH="$GITHUB_WORKSPACE/examples/multinode" timeout 150s \
            .venv/bin/art-monarch local \
            --program program:main \
            --port 0 \
            --startup-timeout 90
          test ! -e "$ART_VLLM_RUNTIME_CACHE_DIR"
