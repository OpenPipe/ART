name: TrainerRank GPU validation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      context:
        description: Free Kubernetes context for this validation
        type: choice
        default: cks-wb3
        options:
          - cks-wb3
          - ext-collab2
      base_sha:
        description: Exact PR base SHA to bind this manual run for ready-for-review reuse
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: trainer-rank-gpu-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      required: ${{ steps.changes.outputs.required }}
      head_sha: ${{ steps.changes.outputs.head_sha }}
      reused: ${{ steps.reuse.outputs.reused }}
      reused_run: ${{ steps.reuse.outputs.run_id }}
      admission_deadline: ${{ steps.admission.outputs.deadline }}
    steps:
      - id: admission
        name: Bound GPU client admission wait
        # Preserve this classification's cutoff; rerun all jobs for a fresh window.
        run: echo "deadline=$(( $(date +%s) + 1800 ))" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - id: reuse
        name: Find exact prior GPU validation
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request;
            const identity = [
              pull?.head?.repo?.full_name,
              pull?.head?.ref,
              pull?.head?.sha,
              pull?.base?.sha,
            ];
            if (!identity.every(value =>
              typeof value === 'string' && value.length > 0
            )) {
              core.warning('Prior GPU validation identity is incomplete.');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'trainer-rank-gpu.yml',
              event: 'pull_request',
              head_sha: pull.head.sha,
              status: 'success',
              per_page: 100,
            });
            const candidates = runs.data.workflow_runs.filter(run =>
              run.id !== context.runId &&
              run.head_repository?.full_name === pull.head.repo.full_name &&
              run.head_branch === pull.head.ref &&
              run.head_sha === pull.head.sha &&
              run.path === '.github/workflows/trainer-rank-gpu.yml'
            ).slice(0, 10);
            for (const run of candidates) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              });
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: run.id,
                per_page: 100,
              });
              const passed = jobs.data.jobs.some(job =>
                job.name === 'Run on 2x H200' && job.conclusion === 'success'
              );
              const base = artifacts.data.artifacts.some(artifact =>
                !artifact.expired && artifact.name ===
                  `trainer-rank-result-${run.id}-${run.run_attempt}-${pull.base.sha}`
              );
              if (passed && base) {
                core.setOutput('reused', 'true');
                core.setOutput('run_id', String(run.id));
                core.info(`Reusing successful workflow run ${run.id}.`);
                return;
              }
            }
            // Manual validation needs prospective base provenance inside the
            // unchanged manual artifact. Never derive it from this PR later.
            const manualRuns = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'trainer-rank-gpu.yml',
              event: 'workflow_dispatch',
              head_sha: pull.head.sha,
              status: 'success',
              per_page: 100,
            });
            const fs = require('fs');
            const path = require('path');
            const {execFileSync} = require('child_process');
            for (const run of manualRuns.data.workflow_runs.filter(run =>
              run.id !== context.runId &&
              run.head_repository?.full_name === pull.head.repo.full_name &&
              run.head_branch === pull.head.ref &&
              run.head_sha === pull.head.sha &&
              run.path === '.github/workflows/trainer-rank-gpu.yml'
            ).slice(0, 10)) {
              const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'manual-reuse-'));
              try {
                const jobs = await github.rest.actions.listJobsForWorkflowRunAttempt({
                  ...context.repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100,
                });
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  ...context.repo, run_id: run.id, per_page: 100,
                });
                const matches = artifacts.data.artifacts.filter(artifact =>
                  !artifact.expired && artifact.name ===
                    `trainer-rank-result-${run.id}-${run.run_attempt}-manual`
                );
                if (matches.length !== 1 || matches[0].size_in_bytes > 64 * 1024 * 1024) continue;
                const artifact = matches[0];
                const download = await github.rest.actions.downloadArtifact({
                  ...context.repo, artifact_id: artifact.id, archive_format: 'zip',
                });
                const archive = path.join(directory, 'result.zip');
                fs.writeFileSync(archive, Buffer.from(download.data));
                const current = await github.rest.actions.getWorkflowRun({
                  ...context.repo, run_id: run.id,
                });
                const receipt = execFileSync('python3', [
                  'scripts/ci/trainer_rank_manual_reuse.py', 'verify', archive,
                ], {
                  input: JSON.stringify({pull, run: current.data, artifact, jobs: jobs.data.jobs}),
                  encoding: 'utf8', timeout: 30000,
                });
                core.info(receipt.trim());
                core.setOutput('reused', 'true');
                core.setOutput('run_id', String(run.id));
                return;
              } catch (error) {
                core.warning(`Manual run ${run.id} is not reusable: ${error.message}`);
              } finally {
                fs.rmSync(directory, {recursive: true, force: true});
              }
            }

      - id: changes
        name: Classify changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
            echo "### Manual TrainerRank GPU validation requested" \
              >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
            echo "Validating \`${GITHUB_REF}\` at \`${HEAD_SHA}\`." \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "${BASE_SHA}"

          pattern='^src/art/(trainer_rank/|megatron/(_hybrid_ep/|hybrid_ep_setup\.py|setup\.sh|prefix_tree(_packing|_state)?\.py|context_parallel/|flex_attn/|gdn/|lora\.py|megatron_patches\.py|training/(finalize_grads|microbatches)\.py))'
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          critical="$(printf '%s\n' "${changed}" | grep -E "${pattern}" || true)"
          if [ -n "${critical}" ]; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
            {
              echo "### TrainerRank GPU validation required"
              echo
              echo '```text'
              printf '%s\n' "${critical}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "required=false" >> "${GITHUB_OUTPUT}"
            echo "### TrainerRank GPU validation not required" >> "${GITHUB_STEP_SUMMARY}"
          fi

  api-enclosure:
    name: Qualify CI API enclosure (CPU only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Qualify detached-child retirement without Sky or credentials
        run: python3 scripts/ci/trainer_rank_api.py probe "${RUNNER_TEMP}/api-enclosure-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-enclosure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-enclosure-probe

  validate:
    name: Run on 2x H200
    needs: [classify, api-enclosure]
    if: needs.classify.outputs.required == 'true' && needs.classify.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: trainer-rank-gpu-capacity-${{ inputs.context || vars.TRAINER_RANK_GPU_CONTEXT || 'cks-wb3' }}
      cancel-in-progress: false
      queue: max
    environment: trainer-rank-gpu-validation
    env:
      SKYPILOT_DISABLE_LOCAL_API_SERVER: "1"
      SKY_INFRA: k8s/${{ inputs.context || vars.TRAINER_RANK_GPU_CONTEXT || 'cks-wb3' }}
      EXPECTED_HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
      ADMISSION_DEADLINE: ${{ needs.classify.outputs.admission_deadline }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.head_sha }}

      - name: Check admission deadline
        run: python3 scripts/ci/trainer-rank-gpu.py admit "${RUNNER_TEMP}/trainer-rank-result"

      - name: Record prospective manual reuse provenance
        if: github.event_name == 'workflow_dispatch' && inputs.base_sha != ''
        env:
          REUSE_BASE_SHA: ${{ inputs.base_sha }}
        run: python3 scripts/ci/trainer_rank_manual_reuse.py record "${RUNNER_TEMP}/trainer-rank-result"

      - name: Install launch dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          # socat only needs Ubuntu; unrelated third-party apt feeds can be broken.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
          )
          sudo apt-get "${apt_sources[@]}" update --error-on=any
          sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends socat
          kubectl_version="$(curl -LsSf https://dl.k8s.io/release/stable.txt)"
          kubectl_path="${RUNNER_TEMP}/kubectl"
          curl -LsSf -o "${kubectl_path}" \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          sudo install -m 0755 "${kubectl_path}" /usr/local/bin/kubectl

      - name: Configure Kubernetes
        env:
          KUBECONFIG_VALUE: ${{ secrets[env.SKY_INFRA == 'k8s/ext-collab2' && 'GPU_IMAGE_KUBECONFIG' || 'CKS_WB3_KUBECONFIG'] }}
        run: |
          set -euo pipefail
          case "${SKY_INFRA}" in
            k8s/cks-wb3|k8s/ext-collab2) ;;
            *) echo "Unsupported GPU CI context" >&2; exit 1 ;;
          esac
          test -n "${KUBECONFIG_VALUE}"
          mkdir -p "${HOME}/.kube"
          KUBECONFIG_PATH="${HOME}/.kube/config" python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          value = os.environ["KUBECONFIG_VALUE"].encode()
          try:
              decoded = base64.b64decode(b"".join(value.split()), validate=True)
              data = decoded if decoded.lstrip().startswith(b"apiVersion:") else value
          except binascii.Error:
              data = value
          Path(os.environ["KUBECONFIG_PATH"]).write_bytes(data)
          PY
          chmod 600 "${HOME}/.kube/config"
          kubectl --context "${SKY_INFRA#k8s/}" get nodes >/dev/null

      - name: Configure SkyPilot workload identity
        run: |
          mkdir -p "${HOME}/.sky"
          context="${SKY_INFRA#k8s/}"
          cat > "${HOME}/.sky/config.yaml" <<YAML
          # Use the pre-provisioned least-privilege service account instead of
          # allowing SkyPilot to create its broadly privileged legacy RBAC.
          allowed_clouds:
            - kubernetes
          kubernetes:
            allowed_contexts:
              - ${context}
            remote_identity:
              ${context}: skypilot-workload
          YAML

      - name: Run TrainerRank GPU validation
        env:
          EXPECTED_HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: |
          set -euo pipefail
          sky_venv="${RUNNER_TEMP}/skypilot"
          uv venv --python 3.10 "${sky_venv}"
          # Preserve cancelled requests before retry callbacks can reschedule them.
          uv pip install --python "${sky_venv}/bin/python" \
            'skypilot[kubernetes,remote] @ git+https://github.com/OpenPipe/skypilot-modal.git@924100745348cb0d880ba9e1f64b4e54cb1c0898' \
            'kubernetes==34.1.0'
          "${sky_venv}/bin/python" scripts/ci/trainer-rank-gpu.py \
            "${RUNNER_TEMP}/trainer-rank-result"

      - name: Reconcile owned GPU resources
        if: always()
        run: |
          python="${RUNNER_TEMP}/skypilot/bin/python"
          if [ ! -x "${python}" ]; then python=python3; fi
          "${python}" scripts/ci/trainer-rank-gpu.py cleanup \
            "${RUNNER_TEMP}/trainer-rank-result"

      - name: Preserve remote result and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-rank-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.base.sha || 'manual' }}
          path: ${{ runner.temp }}/trainer-rank-result
          if-no-files-found: warn

  gate:
    name: trainer-rank-gpu-validation
    needs: [classify, api-enclosure, validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          ENCLOSURE_RESULT: ${{ needs.api-enclosure.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          REQUIRED: ${{ needs.classify.outputs.required }}
          REUSED: ${{ needs.classify.outputs.reused }}
          REUSED_RUN: ${{ needs.classify.outputs.reused_run }}
          RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          if [ "${ENCLOSURE_RESULT}" != "success" ]; then
            echo "CI API enclosure qualification failed." >&2
            exit 1
          fi
          if [ "${CLASSIFY_RESULT}" != "success" ]; then
            echo "TrainerRank GPU classification failed." >&2
            exit 1
          fi
          if [ "${REQUIRED}" = "true" ] \
            && [ "${REUSED}" != "true" ] \
            && [ "${RESULT}" != "success" ]; then
            echo "TrainerRank GPU validation required but result was ${RESULT}." >&2
            exit 1
          fi
          if [ "${REUSED}" = "true" ]; then
            test -n "${REUSED_RUN}"
            echo "TrainerRank GPU validation reused from exact run ${REUSED_RUN}." \
              | tee -a "${GITHUB_STEP_SUMMARY}"
          elif [ "${REQUIRED}" = "true" ]; then
            echo "TrainerRank GPU validation passed."
          else
            echo "TrainerRank GPU validation was not required."
          fi
