[project]
name = "art-vllm-runtime"
version = "0.1.0"
description = "Tiny ART-owned vLLM runtime package"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai==2.53.0",
    "pydantic>=2.12.5",
    "transformers==5.12.1",
]

[project.optional-dependencies]
cuda12 = [
    "nixl-cu12==1.3.2 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nccl-cu12==2.28.9 ; sys_platform == 'linux'",
    "torch==2.11.0 ; sys_platform == 'linux'",
    "torchaudio==2.11.0 ; sys_platform == 'linux'",
    "torchvision==0.26.0 ; sys_platform == 'linux'",
    "vllm @ https://github.com/vllm-project/vllm/releases/download/v0.25.1/vllm-0.25.1%2Bcu129-cp38-abi3-manylinux_2_28_x86_64.whl ; sys_platform == 'linux'",
]
cuda13 = [
    "nixl-cu13==1.3.2 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nccl-cu13==2.28.9 ; sys_platform == 'linux'",
    "torch==2.11.0 ; sys_platform == 'linux'",
    "torchaudio==2.11.0 ; sys_platform == 'linux'",
    "torchvision==0.26.0 ; sys_platform == 'linux'",
    "triton-kernels @ git+https://github.com/triton-lang/triton.git@7c56a5e40f7fd928dfd5c72902d5def0097db73a#subdirectory=python/triton_kernels ; sys_platform == 'linux'",
    "vllm @ https://github.com/vllm-project/vllm/releases/download/v0.25.1/vllm-0.25.1-cp38-abi3-manylinux_2_28_x86_64.whl ; sys_platform == 'linux'",
]

[project.scripts]
art-vllm-runtime-server = "art_vllm_runtime.dedicated_server:main"

[project.entry-points."vllm.general_plugins"]
art = "art_vllm_runtime.patches:apply_vllm_runtime_patches"

[project.entry-points."vllm.stat_logger_plugins"]
art = "art_vllm_runtime.metrics:ArtRuntimeStatLogger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/art_vllm_runtime"]

[tool.hatch.build]
sources = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
required-version = ">=0.6.15"
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }]]
override-dependencies = [
    "flashinfer-python==0.6.13",
    "transformers==5.12.1",
    "xgrammar==0.2.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cuda12" },
    { index = "pytorch-cu130", extra = "cuda13" },
]
torchaudio = [
    { index = "pytorch-cu128", extra = "cuda12" },
    { index = "pytorch-cu130", extra = "cuda13" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "cuda12" },
    { index = "pytorch-cu130", extra = "cuda13" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
