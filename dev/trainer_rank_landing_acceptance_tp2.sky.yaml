# TP support gate: DP1 x TP2 x CP1 public dp_rank_forward cell (2x H200, Kubernetes).
#
# First public-API execution of the automatic planner under tensor
# parallelism on the full Qwen3.5-4B: planner-selected prefix sharing -> GDN
# prefix state -> sequence parallelism -> TP output head -> backward through an
# active LoRA slot, automatic vs depth-one (see phase_tp2_public in
# dev/trainer_rank_landing_acceptance.py for the gates). Also runs the CI GPU
# check script at TP=2 (16 request combinations, two slots).
#
# Usage:
#   sky launch -c tr-tp2 dev/trainer_rank_landing_acceptance_tp2.sky.yaml \
#     --env RUN_ID=<run id>

name: trainer-rank-tp2-gate

workdir: .

envs:
  RUN_ID: unset

resources:
  cloud: kubernetes
  accelerators: H200:2
  cpus: 24+
  memory: 192+
  image_id: docker:docker.io/bradhiltonnw/art-gpu@sha256:f93fda4032bf37f16d9c639c51daf73e1a884df97d14baabf349868831321bdc

setup: |
  set -euo pipefail
  export CC=gcc CXX=g++
  uv sync --frozen --extra megatron --group dev
  uv sync --project megatron_runtime --extra cuda12 --group test --frozen
  uv pip install --python megatron_runtime/.venv/bin/python --no-deps --editable .

run: |
  set -euo pipefail
  : "${RUN_ID:?RUN_ID is required}"
  root="scratch/trainer_rank_landing_acceptance/${RUN_ID}"
  mkdir -p "${root}"

  export ART_MEGATRON_TENSOR_MODEL_PARALLEL_SIZE=2
  export ART_MEGATRON_CONTEXT_PARALLEL_SIZE=1
  export ART_MEGATRON_DATA_PARALLEL_SIZE=1
  export ART_MEGATRON_PIPELINE_MODEL_PARALLEL_SIZE=1
  export TOKENIZERS_PARALLELISM=false
  export PYTHONUNBUFFERED=1

  uv run --no-sync python dev/trainer_rank_landing_acceptance.py --phase contract

  timeout 7200s megatron_runtime/.venv/bin/python -m torch.distributed.run --standalone --nproc-per-node=2 \
    dev/trainer_rank_check.py --model Qwen/Qwen3-0.6B --layers 1 \
    --anchors no_sharing,full_sharing --slots 2 \
    2>&1 | tee "${root}/check_tp2.log"

  timeout 14400s megatron_runtime/.venv/bin/python -m torch.distributed.run --standalone --nproc-per-node=2 \
    dev/trainer_rank_landing_acceptance.py --phase tp2-public --tp 2 --repeat 10 \
    --evidence "${root}/evidence.jsonl" --dump-dir "${root}/dump" \
    2>&1 | tee "${root}/tp2_public.log"

config:
  kubernetes:
    pod_config:
      spec:
        schedulerName: binpack-scheduler
        activeDeadlineSeconds: 42000
        containers:
          - name: ray-node
            imagePullPolicy: Always
            env:
              - name: UV_LINK_MODE
                value: copy
