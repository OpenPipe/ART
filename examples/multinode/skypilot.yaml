name: art-multinode

num_nodes: 2

workdir: .

resources:
  cpus: 4+
  memory: 8+

envs:
  PYTHONUTF8: "1"

setup: |
  set -euo pipefail
  uv sync --frozen --no-dev --extra distributed

run: |
  set -euo pipefail
  exec .venv/bin/art-monarch skypilot \
    --program art.distributed.monarch_bootstrap:deployment_smoke
