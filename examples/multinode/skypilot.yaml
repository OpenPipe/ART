name: art-multinode

num_nodes: 2

workdir: .

resources:
  cpus: 4+
  memory: 8+

envs:
  PYTHONUTF8: "1"

setup: |
  set -euo pipefail
  uv sync --frozen --no-dev --extra distributed

run: |
  set -euo pipefail
  export PYTHONPATH="$PWD/examples/multinode${PYTHONPATH:+:$PYTHONPATH}"
  exec .venv/bin/art-monarch skypilot \
    --program program:main \
    --startup-timeout 90
