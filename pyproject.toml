[project]
name = "openpipe-art"
version = "0.5.19"
description = "The OpenPipe Agent Reinforcement Training (ART) library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.0",
    "anthropic>=0.77.0",
    "openai>=2.14.0,<3",
    "pydantic>=2.12",
    "requests>=2.32.0",
    "typing-extensions>=4.13",
    "typer>=0.15.2",
    "litellm>=1.71.1,<=1.82.0",
    "weave>=0.52.41",
    "polars>=1.26.0",
    "tblib>=3.0.0",
    "nest-asyncio>=1.6.0",
    "numpy>=1.26",
    "setproctitle>=1.3.6",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.10.1", "seaborn>=0.13.2"]
distributed = [
    "aiohttp>=3.13.0",
    "msgspec>=0.21.0",
    "torch==2.11.0+cu128 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.11.0 ; sys_platform == 'darwin'",
    "torchmonarch==0.6.0",
    "transformers>=5.2.0,<=5.12.1",
    "uv>=0.11.7",
]
distributed-cu130 = [
    "aiohttp>=3.13.0",
    "msgspec>=0.21.0",
    "torch==2.11.0+cu130 ; sys_platform == 'linux'",
    "torchmonarch==0.6.0",
    "transformers>=5.2.0,<=5.12.1",
    "uv>=0.11.7",
]
tensors = ["torch==2.11.0"]

backend = [
    "peft>=0.14.0",
    "hf-xet>=1.1.0",
    "bitsandbytes>=0.45.2,!=0.50.0",
    "unsloth==2026.3.3",
    "unsloth-zoo==2026.3.1",
    "torch==2.11.0+cu128 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.11.0 ; sys_platform == 'darwin'",
    "torchao==0.16.0",
    "accelerate==1.7.0",
    "awscli>=1.38.1",
    "setuptools>=78.1.0",
    "wandb==0.28.0",
    "transformers==5.2.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "trl==0.20.0",
    "nbclient>=0.10.1",
    "pytest>=8.4.1",
    "nbmake>=1.5.5",
    "gql>=4.0.0",
    "nvidia-cudnn-frontend<1.21 ; sys_platform == 'linux'",
    "nvidia-resiliency-ext<0.5 ; sys_platform == 'linux'",
    "uv>=0.11.7",
]
backend-cu130 = [
    "peft>=0.14.0",
    "hf-xet>=1.1.0",
    "bitsandbytes>=0.45.2,!=0.50.0",
    "unsloth==2026.3.3",
    "unsloth-zoo==2026.3.1",
    "torch==2.11.0+cu130 ; sys_platform == 'linux'",
    "torchao==0.16.0",
    "accelerate==1.7.0",
    "awscli>=1.38.1",
    "setuptools>=78.1.0",
    "wandb==0.28.0",
    "transformers==5.2.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "trl==0.20.0",
    "nbclient>=0.10.1",
    "pytest>=8.4.1",
    "nbmake>=1.5.5",
    "gql>=4.0.0",
    "nvidia-cudnn-frontend<1.21 ; sys_platform == 'linux'",
    "nvidia-nccl-cu13==2.28.9 ; sys_platform == 'linux'",
    "nvidia-resiliency-ext<0.5 ; sys_platform == 'linux'",
    "uv>=0.11.7",
]
megatron = [
    "aiohttp>=3.13.0",
    "msgspec>=0.21.0",
    "nvidia-cuda-cccl-cu12==12.9.27 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy<2",
    "nixl-cu12==1.3.2 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "peft>=0.14.0",
    "torch==2.11.0+cu128 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.11.0 ; sys_platform == 'darwin'",
    "torchmonarch==0.6.0",
    "transformers==5.12.1",
    "uv>=0.11.7",
]
megatron-cu130 = [
    "aiohttp>=3.13.0",
    "msgspec>=0.21.0",
    "numpy<2",
    "nixl-cu13==1.3.2 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "peft>=0.14.0",
    "torch==2.11.0+cu130 ; sys_platform == 'linux'",
    "torchmonarch==0.6.0",
    "transformers==5.12.1",
    "uv>=0.11.7",
]

langgraph = [
    "langchain-core>=0.3.51",
    "langgraph>=0.6.2",
    "langchain-openai>=0.3.27",
]
tinker = [
    "fastapi>=0.128.0",
    "huggingface_hub",
    "numpy<2",
    "pillow",
    "pyarrow>=15.0.0",
    "pydantic>=2.12.5",
    "protobuf>=6.31.1",
    "tinker-cookbook>=0.5.2,<0.6",
    "tinker>=0.23.4,<0.24",
    "torch==2.11.0",
    "transformers>=5.2.0,<=5.5.3",
    "uvicorn>=0.35.0",
    "datrie>=0.8.3",
]

[project.scripts]
art = "art.cli:app"
art-monarch = "art.distributed.monarch_bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/art", "src/mp_actors"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills" = "art/skills"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
sources = []
only-include = [
    ".agents/skills",
    "LICENSE",
    "README.md",
    "THIRD-PARTY-NOTICES",
    "pyproject.toml",
    "src",
]
exclude = [
    "/dev",
    "/wandb",
    "/.art",
    "/.local",
    "/.ruff_cache",
    "/.venv",
    "/dist",
    "/scratch",
    "/unsloth_compiled_cache",
    "/.git",
    "/.github",
    "/examples/*/data",
    "/examples/*/wandb",
    "/tests/unsloth_compiled_cache",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.ruff]
extend-exclude = ["src/art/megatron/_hybrid_ep"]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
case-sensitive = false
known-first-party = ["art"]
known-third-party = ["tinker", "tinker_cookbook", "wandb"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live_api_cost: opt-in live API cost validation against provider endpoints",
]

[tool.uv]
required-version = ">=0.11.7"
conflicts = [
    [
        { extra = "backend" },
        { extra = "megatron" },
    ],
    [
        { extra = "tinker" },
        { extra = "megatron" },
    ],
    [
        { extra = "distributed" },
        { extra = "distributed-cu130" },
    ],
    [
        { extra = "distributed" },
        { extra = "backend-cu130" },
    ],
    [
        { extra = "distributed" },
        { extra = "megatron-cu130" },
    ],
    [
        { extra = "distributed-cu130" },
        { extra = "backend" },
    ],
    [
        { extra = "distributed-cu130" },
        { extra = "megatron" },
    ],
    [
        { extra = "backend" },
        { extra = "backend-cu130" },
    ],
    [
        { extra = "backend" },
        { extra = "megatron-cu130" },
    ],
    [
        { extra = "backend-cu130" },
        { extra = "megatron" },
    ],
    [
        { extra = "backend-cu130" },
        { extra = "megatron-cu130" },
    ],
    [
        { extra = "megatron" },
        { extra = "megatron-cu130" },
    ],
    [
        { extra = "tinker" },
        { extra = "backend-cu130" },
    ],
    [
        { extra = "tinker" },
        { extra = "distributed-cu130" },
    ],
    [
        { extra = "tinker" },
        { extra = "megatron-cu130" },
    ],
]
override-dependencies = [
    "click==8.2.0",
    "numpy<2",
    "nvidia-cublas==13.2.2.2 ; sys_platform == 'linux'",
    "nvidia-resiliency-ext<0.5",
]

[tool.ty.src]
exclude = ["src/art/megatron/_hybrid_ep/**"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Ignore unused-ignore-comment warnings because they vary depending on whether
# optional deps are installed. The ty:ignore comments are needed in CI (with all deps)
# but become unused locally (without all deps).
unused-ignore-comment = "ignore"
unused-type-ignore-comment = "ignore"

[tool.ty.analysis]
# Allow unresolved imports for optional dependencies that may not be installed locally.
# In CI, we install all optional deps so these will be resolved and type-checked.
allowed-unresolved-imports = [
    # tinker deps
    "tinker.**",
    "tinker_cookbook.**",
    "datrie.**",
    # backend deps
    "accelerate.**",
    "awscli.**",
    "bitsandbytes.**",
    "cloudpickle.**",
    "datasets.**",
    "duckdb.**",
    "fastapi.**",
    "gql.**",
    "hf_xet.**",
    "nbclient.**",
    "nbmake.**",
    "peft.**",
    "pyarrow.**",
    "torch.**",
    "torchvision.**",
    "torchao.**",
    "transformers.**",
    "trl.**",
    "unsloth.**",
    "unsloth_zoo.**",
    "uvicorn.**",
    "wandb.**",
    # langgraph deps
    "langchain_core.**",
    "langchain_openai.**",
    "langgraph.**",
    # plotting deps
    "matplotlib.**",
    "seaborn.**",
    # megatron deps
    "causal_conv1d.**",
    "einops.**",
    "fla.**",
    "megatron.**",
    "monarch.**",
    "msgspec.**",
    "quack.**",
    "safetensors.**",
    "scipy.**",
    "transformer_engine.**",
    "triton.**",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "hatch>=1.14.1",
    "ruff>=0.12.1",
    "pytest>=8.4.1",
    "nbval>=0.11.0",
    "pytest-xdist>=3.8.0",
    "ty==0.0.59",
    "pytest-asyncio>=1.1.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "prek>=0.2.29",
    "uv>=0.11.7",
    "skypilot[cudo,do,fluidstack,gcp,kubernetes,lambda,paperspace,runpod]==0.11.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "distributed", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "backend", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "megatron", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", extra = "distributed-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", extra = "backend-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", extra = "megatron-cu130", marker = "sys_platform == 'linux'" },
]
panza = { git = "https://github.com/corbt/panza.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
